
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Real-Time Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e9edf3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.chat-container {
    width: 100%;
    max-width: 450px;
    height: 90vh;
    max-height: 750px;
    background: white;
    display: flex;
    flex-direction: column;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 25px #0002;
}

.header {
    background: #075e54;
    color: white;
    padding: 18px;
    text-align: center;
}

.header h2 {
    margin: 0 0 5px;
}

#status {
    font-size: 12px;
    color: #c9f7df;
}

.login {
    padding: 15px;
    display: flex;
    gap: 8px;
    background: #f5f5f5;
}

input {
    min-width: 0;
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

button {
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    background: #075e54;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #efeae2;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    max-width: 80%;
    padding: 10px 12px;
    border-radius: 10px;
    overflow-wrap: anywhere;
}

.sent {
    background: #d9fdd3;
    align-self: flex-end;
}

.received {
    background: white;
    align-self: flex-start;
}

.sender {
    font-size: 12px;
    font-weight: bold;
    color: #075e54;
    margin-bottom: 5px;
}

.time {
    font-size: 10px;
    color: #777;
    text-align: right;
    margin-top: 5px;
}

.input-area {
    padding: 12px;
    display: flex;
    gap: 8px;
    background: #f5f5f5;
}

#messageInput {
    border-radius: 25px;
    padding-left: 18px;
}

#sendBtn {
    border-radius: 50%;
    width: 48px;
    height: 48px;
    padding: 0;
    font-size: 20px;
}

#chatRoom {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>💬 My Real-Time Chat</h2>
        <div id="status">Connect with another person</div>
    </div>

    <div class="login" id="login">
        <input type="text" id="username"
               placeholder="Enter your name">
        <input type="text" id="roomInput"
               placeholder="Room ID" value="room123">
        <button onclick="joinChat()">Join</button>
    </div>

    <div id="chatRoom">

        <div id="messages"></div>

        <div class="input-area">
            <input type="text" id="messageInput"
                   placeholder="Type a message..."
                   autocomplete="off">

            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "AIzaSyARnhGuI1AYPFsbDjJBhpReYhzJokxQAe8",
    authDomain: "chat-343af.firebaseapp.com",
    databaseURL: "https://chat-343af-default-rtdb.firebaseio.com",
    projectId: "chat-343af",
    storageBucket: "chat-343af.firebasestorage.app",
    messagingSenderId: "272884820056",
    appId: "1:272884820056:web:35d52529119737e94e422d",
    measurementId: "G-XT7XPN2XL3"
};

// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

let currentUser = "";
let currentRoom = "";
let messagesRef = null;

const login = document.getElementById("login");
const chatRoom = document.getElementById("chatRoom");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const statusText = document.getElementById("status");

// JOIN CHAT

window.joinChat = function() {

    const name = document.getElementById("username")
        .value.trim();

    const room = document.getElementById("roomInput")
        .value.trim();

    if (!name || !room) {
        alert("Enter your name and room ID");
        return;
    }

    currentUser = name;
    currentRoom = room;

    login.style.display = "none";
    chatRoom.style.display = "flex";

    statusText.innerText = "Room: " + currentRoom;

    messagesRef = ref(
        database,
        "chats/" + currentRoom + "/messages"
    );

    // LISTEN FOR REAL-TIME MESSAGES

    onChildAdded(messagesRef, (snapshot) => {

        const data = snapshot.val();

        if (data) {
            displayMessage(data);
        }

    });

};

// DISPLAY MESSAGE

function displayMessage(data) {

    const messageDiv = document.createElement("div");

    messageDiv.classList.add("message");

    if (data.sender === currentUser) {
        messageDiv.classList.add("sent");
    } else {
        messageDiv.classList.add("received");
    }

    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = data.sender || "Unknown";

    const text = document.createElement("div");
    text.textContent = data.text || "";

    const time = document.createElement("div");
    time.className = "time";

    time.textContent = data.timestamp
        ? new Date(data.timestamp).toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        })
        : "Sending...";

    messageDiv.appendChild(sender);
    messageDiv.appendChild(text);
    messageDiv.appendChild(time);

    messages.appendChild(messageDiv);

    messages.scrollTop = messages.scrollHeight;
}

// SEND MESSAGE

window.sendMessage = async function() {

    const text = messageInput.value.trim();

    if (!text || !messagesRef) return;

    sendBtn.disabled = true;

    try {

        await push(messagesRef, {
            sender: currentUser,
            text: text,
            timestamp: serverTimestamp()
        });

        messageInput.value = "";
        messageInput.focus();

    } catch (error) {

        alert("Message failed: " + error.message);

    } finally {
        sendBtn.disabled = false;
    }

};

// SEND USING ENTER KEY

messageInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
