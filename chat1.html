
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMA 2 Chat</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg,#dceee9,#e8edf5);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.chat-container {
    width: 450px;
    max-width: 100%;
    height: 700px;
    max-height: 95vh;
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 15px 45px rgba(0,0,0,.15);
}

/* HEADER */

.chat-header {
    background: linear-gradient(135deg,#075e54,#128c7e,#25a18e);
    padding: 20px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 48px;
    height: 48px;
    background: white;
    color: #087b69;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 3px 10px #0002;
}

.username {
    font-size: 18px;
    font-weight: bold;
}

.status {
    font-size: 12px;
    margin-top: 4px;
    color: #d6fff0;
}

.delete-btn {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    color: white;
    padding: 10px 13px;
    border-radius: 20px;
    cursor: pointer;
    transition: .3s;
}

.delete-btn:hover {
    background: #d93025;
}

/* CHAT AREA */

.chat-box {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    background-color: #edf4f1;
    background-image: radial-gradient(#c7d9d1 0.6px, transparent 0.6px);
    background-size: 15px 15px;
}

.message {
    max-width: 82%;
    min-width: 90px;
    width: fit-content;
    padding: 11px 13px 23px;
    margin-bottom: 14px;
    border-radius: 14px;
    position: relative;
    overflow-wrap: anywhere;
    animation: appear .25s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,.07);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.sent {
    background: #d7f8df;
    margin-left: auto;
    border-bottom-right-radius: 3px;
}

.received {
    background: white;
    margin-right: auto;
    border-bottom-left-radius: 3px;
}

.sender-name {
    color: #087b69;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
}

.message-text {
    font-size: 15px;
    color: #252525;
    white-space: pre-wrap;
    line-height: 1.5;
}

.message-time {
    position: absolute;
    right: 9px;
    bottom: 6px;
    font-size: 10px;
    color: #77827d;
}

.empty {
    text-align: center;
    color: #777;
    margin-top: 40px;
    font-size: 14px;
}

/* FOOTER */

.chat-footer {
    padding: 13px;
    display: flex;
    gap: 10px;
    background: white;
    border-top: 1px solid #eee;
    align-items: center;
}

.chat-footer input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: #f1f5f3;
    padding: 14px 18px;
    border-radius: 30px;
    font-size: 15px;
}

.send-btn {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg,#087b69,#075e54);
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: .3s;
}

.send-btn:hover {
    transform: scale(1.08);
    background: #034d43;
}

.send-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
}

button {
    font-family: inherit;
}

.chat-box::-webkit-scrollbar {
    width: 5px;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #a7c8ba;
    border-radius: 10px;
}

@media(max-width:480px) {
    body {
        padding: 0;
    }

    .chat-container {
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">

        <div class="user-info">
            <div class="avatar">U</div>

            <div>
                <div class="username">MAHESH</div>
                <div class="status" id="status">
                    Connecting...
                </div>
            </div>
        </div>

        <button class="delete-btn" id="deleteBtn">
            🗑 Delete
        </button>

    </div>

    <div class="chat-box" id="chatBox">
        <p class="empty">Loading messages...</p>
    </div>

    <div class="chat-footer">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            maxlength="2000"
            autocomplete="off"
        >

        <button class="send-btn" id="sendBtn">
            ➤
        </button>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    remove
}
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyARnhGuI1AYPFsbDjJBhpReYhzJokxQAe8",
    authDomain: "chat-343af.firebaseapp.com",
    databaseURL: "https://chat-343af-default-rtdb.firebaseio.com",
    projectId: "chat-343af",
    storageBucket: "chat-343af.firebasestorage.app",
    messagingSenderId: "272884820056",
    appId: "1:272884820056:web:35d52529119737e94e422d",
    measurementId: "G-XT7XPN2XL3"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const messagesRef = ref(database, "messages");

const currentUser = "UMA 2";

const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const deleteBtn = document.getElementById("deleteBtn");
const status = document.getElementById("status");


// SEND MESSAGE

async function sendMessage() {

    const text = messageInput.value.trim();

    if (!text || sendBtn.disabled) return;

    sendBtn.disabled = true;

    try {

        const newMessageRef = push(messagesRef);

        await set(newMessageRef, {
            sender: currentUser,
            text: text,
            timestamp: Date.now()
        });

        messageInput.value = "";
        messageInput.focus();

    } catch(error) {

        console.error(error);
        alert("Message sending failed: " + error.message);

    } finally {

        sendBtn.disabled = false;

    }
}

sendBtn.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", (event) => {

    if(event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }

});


// RECEIVE MESSAGES

onValue(messagesRef, (snapshot) => {

    chatBox.innerHTML = "";

    status.textContent = "● Online";

    if(!snapshot.exists()) {

        chatBox.innerHTML =
            '<p class="empty">💬 No messages yet. Start chatting!</p>';

        return;
    }

    const messages = Object.entries(snapshot.val());

    messages.sort((a,b) =>
        (a[1].timestamp || 0) - (b[1].timestamp || 0)
    );

    messages.forEach(([id,message]) => {

        const messageElement = document.createElement("div");

        const isSent = message.sender === currentUser;

        messageElement.classList.add(
            "message",
            isSent ? "sent" : "received"
        );

        if(!isSent) {

            const senderName = document.createElement("div");

            senderName.className = "sender-name";
            senderName.textContent = message.sender || "Unknown";

            messageElement.appendChild(senderName);

        }

        const messageText = document.createElement("div");

        messageText.className = "message-text";
        messageText.textContent = message.text || "";

        messageElement.appendChild(messageText);

        const time = document.createElement("span");

        time.className = "message-time";

        const date = new Date(message.timestamp);

        time.textContent = isNaN(date.getTime())
            ? ""
            : date.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });

        messageElement.appendChild(time);

        chatBox.appendChild(messageElement);

    });

    chatBox.scrollTop = chatBox.scrollHeight;

}, (error) => {

    console.error(error);

    status.textContent = "Connection error";

    chatBox.textContent = "Firebase error: " + error.message;

});


// DELETE CHAT

deleteBtn.addEventListener("click", async () => {

    const confirmDelete = confirm(
        "Are you sure you want to delete all messages?"
    );

    if(!confirmDelete) return;

    deleteBtn.disabled = true;

    try {

        await remove(messagesRef);

        alert("All messages deleted successfully!");

    } catch(error) {

        alert("Delete failed: " + error.message);

    } finally {

        deleteBtn.disabled = false;

    }

});

</script>

</body>
</html>
