
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMA Chat Application</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e9edef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .chat-container {
      width: 420px;
      max-width: 100%;
      height: 650px;
      max-height: 95vh;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      color: #075e54;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
    }

    .username {
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      color: #d4f5e7;
      margin-top: 4px;
    }

    .delete-btn {
      background: #222;
      color: white;
      border: none;
      padding: 9px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #d32f2f;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .message {
      max-width: 80%;
      width: fit-content;
      min-width: 90px;
      padding: 10px 12px 20px;
      margin-bottom: 12px;
      border-radius: 10px;
      position: relative;
      overflow-wrap: anywhere;
    }

    .sent {
      background: #dcf8c6;
      margin-left: auto;
      border-top-right-radius: 0;
    }

    .received {
      background: white;
      margin-right: auto;
      border-top-left-radius: 0;
    }

    .sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #075e54;
      margin-bottom: 5px;
    }

    .message-text {
      font-size: 15px;
      white-space: pre-wrap;
    }

    .message-time {
      position: absolute;
      right: 8px;
      bottom: 5px;
      font-size: 10px;
      color: #777;
    }

    .chat-footer {
      display: flex;
      padding: 12px;
      background: white;
      gap: 8px;
    }

    .chat-footer input {
      flex: 1;
      min-width: 0;
      border: 1px solid #ddd;
      border-radius: 25px;
      padding: 12px 15px;
      outline: none;
      font-size: 15px;
    }

    .send-btn {
      background: #075e54;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 0 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      color: #666;
      margin-top: 25px;
      font-size: 14px;
    }

    @media(max-width: 480px) {
      .chat-container {
        height: 95vh;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="chat-header">

      <div class="user-info">
        <div class="avatar">U</div>

        <div>
          <div class="username">UMA</div>
          <div class="status" id="status">Connecting...</div>
        </div>
      </div>

      <button class="delete-btn" id="deleteBtn">
        Delete Chat
      </button>

    </div>

    <div class="chat-box" id="chatBox">
      <p class="empty">Loading messages...</p>
    </div>

    <div class="chat-footer">

      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        maxlength="2000"
        autocomplete="off"
      >

      <button class="send-btn" id="sendBtn">
        Send
      </button>

    </div>

  </div>


  <script type="module">

    // Firebase imports
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      onValue,
      remove
    } from
      "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";


    // YOUR NEW FIREBASE CREDENTIALS
    const firebaseConfig = {

      apiKey: "AIzaSyARnhGuI1AYPFsbDjJBhpReYhzJokxQAe8",

      authDomain: "chat-343af.firebaseapp.com",

      databaseURL: "https://chat-343af-default-rtdb.firebaseio.com",

      projectId: "chat-343af",

      storageBucket: "chat-343af.firebasestorage.app",

      messagingSenderId: "272884820056",

      appId: "1:272884820056:web:35d52529119737e94e422d",

      measurementId: "G-XT7XPN2XL3"

    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // Database reference
    const messagesRef = ref(database, "messages");


    // HTML elements
    const chatBox = document.getElementById("chatBox");

    const messageInput = document.getElementById("messageInput");

    const sendBtn = document.getElementById("sendBtn");

    const deleteBtn = document.getElementById("deleteBtn");

    const status = document.getElementById("status");


    // Current username
    // Change this name for each user's device.
    const currentUser =
      localStorage.getItem("chatUsername") ||
      prompt("Enter your name:") ||
      "Guest";

    localStorage.setItem("chatUsername", currentUser);


    // SEND MESSAGE
    async function sendMessage() {

      const text = messageInput.value.trim();

      if (text === "") return;

      sendBtn.disabled = true;

      try {

        const newMessageRef = push(messagesRef);

        await set(newMessageRef, {

          sender: currentUser,

          text: text,

          timestamp: Date.now()

        });

        messageInput.value = "";

        messageInput.focus();

      } catch (error) {

        console.error("Send error:", error);

        alert("Message sending failed. Check Firebase rules.");

      } finally {

        sendBtn.disabled = false;

      }

    }


    // SEND BUTTON
    sendBtn.addEventListener("click", sendMessage);


    // ENTER KEY
    messageInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    });


    // RECEIVE REAL-TIME MESSAGES
    onValue(messagesRef, (snapshot) => {

      chatBox.innerHTML = "";

      status.textContent = "Online";

      if (!snapshot.exists()) {

        chatBox.innerHTML =
          '<p class="empty">No messages yet. Start chatting!</p>';

        return;

      }

      const messages = snapshot.val();

      const messageList = Object.entries(messages);

      // Sort messages by time
      messageList.sort((a, b) => {

        return (a[1].timestamp || 0) -
               (b[1].timestamp || 0);

      });


      messageList.forEach(([id, message]) => {

        const messageElement = document.createElement("div");

        messageElement.classList.add("message");

        const isSent = message.sender === currentUser;

        messageElement.classList.add(
          isSent ? "sent" : "received"
        );


        // Show sender name
        if (!isSent) {

          const senderName = document.createElement("div");

          senderName.className = "sender-name";

          senderName.textContent = message.sender || "Unknown";

          messageElement.appendChild(senderName);

        }


        // Message text
        const messageText = document.createElement("div");

        messageText.className = "message-text";

        messageText.textContent = message.text || "";

        messageElement.appendChild(messageText);


        // Message time
        const time = document.createElement("span");

        time.className = "message-time";

        const date = new Date(message.timestamp);

        time.textContent = isNaN(date.getTime())
          ? ""
          : date.toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit"
            });

        messageElement.appendChild(time);


        chatBox.appendChild(messageElement);

      });


      // Scroll to bottom
      chatBox.scrollTop = chatBox.scrollHeight;

    }, (error) => {

      console.error("Firebase error:", error);

      status.textContent = "Connection error";

      chatBox.textContent =
        "Unable to load messages. Check Firebase database permissions.";

    });


    // DELETE ALL CHAT MESSAGES
    deleteBtn.addEventListener("click", async function() {

      const confirmDelete = confirm(
        "Are you sure you want to delete ALL chat messages?"
      );

      if (!confirmDelete) return;

      deleteBtn.disabled = true;

      try {

        await remove(messagesRef);

        alert("All messages deleted successfully.");

      } catch (error) {

        console.error("Delete error:", error);

        alert("Unable to delete messages. Check database permissions.");

      } finally {

        deleteBtn.disabled = false;

      }

    });

  </script>

</body>
</html>
